; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
test_dir = tests

[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
upload_protocol = esptool
test_ignore = test_nivona_vectors
extra_scripts = pre:tools/generate_web_ui.py
; Whole-program optimization keeps the HTTP/WebSocket firmware below the
; existing OTA-slot delivery limit without shrinking either OTA slot.
; Firmware paths use explicit error returns, so omitting C++ exception support
; preserves OTA headroom without changing failure handling.
build_unflags =
  -std=gnu++11
  -fno-lto
build_flags =
  -std=gnu++17
  -flto
  -fno-exceptions
  -DCORE_DEBUG_LEVEL=0
  -DAPP_NAME=\"esp-coffee-bridge\"
  -DAPP_VERSION=\"0.2.0\"
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
lib_deps =
  bblanchon/ArduinoJson @ 6.21.5
  h2zero/NimBLE-Arduino @ 2.5.1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I tests/support
  -DNATIVE_PROTOCOL_TEST_BUILD=1
build_src_filter =
  +<nivona.cpp>
  +<bridge_jobs.cpp>
  +<bridge_multipart.cpp>
  +<brew_lifecycle.cpp>
  +<recipe_icons.cpp>
  +<recipe_icon_assets.cpp>
  +<native_stub_main.cpp>
  -<main.cpp>
